name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # No hay base de datos en CI todavía (Rec. #57, ambiente de
      # staging/preview, sigue pendiente) — prisma generate solo lee el
      # schema, no necesita conexión real.
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
